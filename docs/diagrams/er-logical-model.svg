<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1560" viewBox="0 0 1800 1560">
<style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:32px;font-weight:700}.head{font-size:20px;font-weight:700;fill:white}.field{font-size:16px}.note{font-size:15px;fill:#536174}.box{fill:#fff;stroke:#3267a8;stroke-width:2}.bar{fill:#3267a8}.line{stroke:#475569;stroke-width:2;fill:none}.rel{font-size:16px;font-weight:700;fill:#3267a8}.diamond{fill:#e9def7;stroke:#7e4aad;stroke-width:3}.oval{fill:#fff8d8;stroke:#b78103;stroke-width:2}</style>
<rect width="1800" height="1120" fill="#f8fbff"/><text x="900" y="55" text-anchor="middle" class="title">Lost &amp; Found System — ER Diagram (Logical Model)</text>
<g transform="translate(70,130)"><rect class="box" width="430" height="375" rx="8"/><rect class="bar" width="430" height="46" rx="8"/><text x="215" y="30" text-anchor="middle" class="head">LOST_ITEM</text><g class="field"><text x="20" y="75">PK  id : String</text><text x="20" y="102">UK  trackingId : String</text><text x="20" y="129">reporterName : String</text><text x="20" y="156">phone : String</text><text x="20" y="183">email : String</text><text x="20" y="210">title, description, category : String</text><text x="20" y="237">locationLost : String</text><text x="20" y="264">dateLost : DateTime</text><text x="20" y="291">imageUrl, imagePublicId : String?</text><text x="20" y="318">status : ACTIVE | RETURNED</text><text x="20" y="345">createdAt, updatedAt : DateTime</text></g></g>
<g transform="translate(1300,130)"><rect class="box" width="430" height="375" rx="8"/><rect class="bar" width="430" height="46" rx="8"/><text x="215" y="30" text-anchor="middle" class="head">FOUND_ITEM</text><g class="field"><text x="20" y="75">PK  id : String</text><text x="20" y="102">UK  trackingId : String</text><text x="20" y="129">reporterName : String</text><text x="20" y="156">phone : String; email : String?</text><text x="20" y="183">title, description, category : String</text><text x="20" y="210">locationFound : String</text><text x="20" y="237">dateFound : DateTime</text><text x="20" y="264">imageUrl, imagePublicId : String</text><text x="20" y="291">status : PENDING | AVAILABLE | RETURNED</text><text x="20" y="318">createdAt, updatedAt : DateTime</text></g></g>
<polygon points="900,285 1080,410 900,535 720,410" class="diamond"/><text x="900" y="403" text-anchor="middle" class="head" fill="#172033">MATCH</text><text x="900" y="428" text-anchor="middle" class="note">potentially matches</text>
<ellipse cx="900" cy="630" rx="145" ry="40" class="oval"/><text x="900" y="636" text-anchor="middle" class="field">score : Int</text><path class="line" d="M900 535V590"/>
<ellipse cx="1195" cy="585" rx="155" ry="40" class="oval"/><text x="1195" y="591" text-anchor="middle" class="field">notifiedAt : DateTime?</text><path class="line" d="M1050 495L1100 548"/>
<ellipse cx="605" cy="585" rx="150" ry="40" class="oval"/><text x="605" y="591" text-anchor="middle" class="field">createdAt / updatedAt</text><path class="line" d="M750 495L700 548"/>
<ellipse cx="900" cy="215" rx="130" ry="40" class="oval"/><text x="900" y="221" text-anchor="middle" class="field">id : String</text><path class="line" d="M900 255V285"/>
<path class="line" d="M500 330L720 410"/><text x="525" y="350" class="rel">1</text><text x="675" y="390" class="rel">0..*</text><text x="520" y="380" class="note">participates in</text><path class="line" d="M1080 410H1300"/><text x="1100" y="395" class="rel">0..*</text><text x="1265" y="395" class="rel">1</text><text x="1120" y="440" class="note">participates in</text>
<g transform="translate(160,700)"><rect class="box" width="430" height="190" rx="8"/><rect class="bar" width="430" height="46" rx="8"/><text x="215" y="30" text-anchor="middle" class="head">ADMIN</text><g class="field"><text x="20" y="80">PK  id : String</text><text x="20" y="110">name : String</text><text x="20" y="140">UK  email : String; password : String</text><text x="20" y="170">createdAt, updatedAt : DateTime</text></g></g>
<g transform="translate(1210,700)"><rect class="box" width="430" height="145" rx="8"/><rect class="bar" width="430" height="46" rx="8"/><text x="215" y="30" text-anchor="middle" class="head">TRACKING_COUNTER</text><g class="field"><text x="20" y="80">PK  year : Int</text><text x="20" y="112">value : Int</text></g></g>
<g transform="translate(445,940)"><rect x="0" y="0" width="130" height="42" class="box"/><text x="145" y="28" class="note">Entity</text><polygon points="350,0 385,21 350,42 315,21" class="diamond"/><text x="405" y="28" class="note">Relationship</text><ellipse cx="650" cy="21" rx="60" ry="21" class="oval"/><text x="730" y="28" class="note">Relationship attribute</text></g>
<text x="900" y="1040" text-anchor="middle" class="note">MATCH is an associative relationship: one LostItem and one FoundItem can participate in many potential-match records; each pair is unique.</text><text x="900" y="1070" text-anchor="middle" class="note">TrackingCounter issues a shared unique tracking ID for LostItem and FoundItem. Admin is an independent authenticated account entity.</text>
<line x1="80" y1="1100" x2="1720" y2="1100" stroke="#94a3b8" stroke-width="2"/><text x="900" y="1145" text-anchor="middle" class="title" font-size="24">Application-Level Relationships</text><text x="900" y="1175" text-anchor="middle" class="note">Dashed connectors below describe API workflows; they are not direct database foreign-key constraints.</text>
<g transform="translate(100,1235)"><rect class="box" width="250" height="100" rx="8"/><rect class="bar" width="250" height="40" rx="8"/><text x="125" y="27" text-anchor="middle" class="head">ADMIN</text><text x="125" y="70" text-anchor="middle" class="field">authenticated operator</text></g>
<polygon points="515,1235 585,1285 515,1335 445,1285" class="diamond"/><text x="515" y="1280" text-anchor="middle" class="field" font-weight="700">MANAGES</text><text x="515" y="1300" text-anchor="middle" class="note">reviews / returns</text>
<g transform="translate(740,1200)"><rect class="box" width="260" height="72" rx="8"/><text x="130" y="44" text-anchor="middle" class="field" font-weight="700">LOST_ITEM</text></g><g transform="translate(740,1300)"><rect class="box" width="260" height="72" rx="8"/><text x="130" y="44" text-anchor="middle" class="field" font-weight="700">FOUND_ITEM</text></g><g transform="translate(1115,1250)"><rect class="box" width="230" height="72" rx="8"/><text x="115" y="44" text-anchor="middle" class="field" font-weight="700">MATCH</text></g>
<path d="M350 1285H445" stroke="#7e4aad" stroke-width="3" stroke-dasharray="10 7" fill="none"/><path d="M585 1285L740 1236" stroke="#7e4aad" stroke-width="3" stroke-dasharray="10 7" fill="none"/><path d="M585 1285L740 1336" stroke="#7e4aad" stroke-width="3" stroke-dasharray="10 7" fill="none"/><path d="M585 1285H1115" stroke="#7e4aad" stroke-width="3" stroke-dasharray="10 7" fill="none"/><text x="620" y="1228" class="note">mark returned / delete</text><text x="620" y="1365" class="note">approve, reject, return / delete</text><text x="900" y="1268" class="note">review potential matches</text>
<g transform="translate(1360,1410)"><rect class="box" width="300" height="95" rx="8"/><rect class="bar" width="300" height="40" rx="8"/><text x="150" y="27" text-anchor="middle" class="head">TRACKING_COUNTER</text><text x="150" y="70" text-anchor="middle" class="field">yearly shared sequence</text></g><polygon points="1090,1395 1165,1445 1090,1495 1015,1445" class="diamond"/><text x="1090" y="1440" text-anchor="middle" class="field" font-weight="700">ASSIGNS</text><text x="1090" y="1460" text-anchor="middle" class="note">tracking ID</text><path d="M1360 1458H1165" stroke="#7e4aad" stroke-width="3" stroke-dasharray="10 7" fill="none"/><path d="M1030 1418L935 1272" stroke="#7e4aad" stroke-width="3" stroke-dasharray="10 7" fill="none"/><path d="M1030 1472L935 1372" stroke="#7e4aad" stroke-width="3" stroke-dasharray="10 7" fill="none"/><text x="735" y="1415" class="note">unique ID generated for both item reports</text>
</svg>
